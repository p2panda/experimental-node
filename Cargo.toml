[package]
name = "experimental-node"
version = "0.1.0"
edition = "2024"

[lib]
name = "p2panda_node"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.85"
futures-util = "0.3.31"
iroh-io = "0.6.2"
mime = "0.3.17"
p2panda-blobs = "0.4.0"
p2panda-core = "0.4.0"
p2panda-net = "0.4.0"
p2panda-store = { version = "0.4.0", features = ["sqlite"] }
p2panda-stream = "0.4.0"
p2panda-discovery = { version = "0.4.0", features = ["mdns"] }
p2panda-sync = { version = "0.4.0", features = ["log-sync"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3.17.1"
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["sync"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = "0.7.13"
tokio-utils = "0.1.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
sqlx = { version = "0.8.6", features = ["sqlite"] }

[dev-dependencies]
tempfile = "3.17.1"
